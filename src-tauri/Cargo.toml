[package]
name = "desipdf"
version = "1.0.0"
description = "DesiPDF - Complete 32-in-1 Document Suite & Dedicated Pages"
authors = ["literalmanish"]
edition = "2021"

[lib]
name = "desipdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
